name: Diagnose Android game startup
on:
  push:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  trace-start:
    name: Android API ${{ matrix.api }} startup trace
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: two-version-render-test-only
          path: qa
          run-id: 45712399477
          github-token: ${{ github.token }}
      - run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: bash scripts/diagnose-start.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-and-log-api-${{ matrix.api }}
          path: diagnostics/
          retention-days: 2
