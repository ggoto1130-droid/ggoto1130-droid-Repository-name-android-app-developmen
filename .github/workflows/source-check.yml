name: Android source check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android build components
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Check out pinned melonDS source
        run: |
          git clone --recurse-submodules https://github.com/rafaelvcaetano/melonDS-android.git melonDS-android
          git -C melonDS-android checkout --detach 909647ba95ce903797e0112fedae570732bfd9cc
          git -C melonDS-android submodule update --init --recursive
      - name: Apply overlay and compile source-check APK
        env:
          MELONDS_SOURCE_DIR: melonDS-android
          ALLOW_MISSING_ROM: '1'
        run: |
          python3 scripts/apply_overlay.py
          cd melonDS-android
          bash ./gradlew :app:assembleGitHubProdDebug
