name: Verify private delivery on Android 16
on:
  push:
    branches: [codex/pokemon-white2-device-check]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate one-time recipient for this runner
        run: |
          umask 077
          openssl req -x509 -newkey rsa:3072 -nodes -keyout "$RUNNER_TEMP/recipient.key" -out "$RUNNER_TEMP/recipient.pem" -days 1 -subj '/CN=Android QA ephemeral recipient' 2>/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ephemeral-public-certificate
          path: ${{ runner.temp }}/recipient.pem
          retention-days: 1
      - name: Enable virtual device
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Exercise the signed release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: python3 scripts/private-device-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-device-evidence
          path: ${{ runner.temp }}/evidence.sealed
          if-no-files-found: ignore
          retention-days: 2
